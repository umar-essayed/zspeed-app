<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z Speed Vendor Portal</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../images/icon.png">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f9fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Loading indicator in case of slow connection */
        .loader-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 1; /* Keep loader on top initially */
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f35535;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 16px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="loader-container" id="loader">
        <div class="loader"></div>
        <div class="loader-text">Loading Z Speed Vendor Portal...</div>
    </div>

    <iframe 
        src="https://zspeed.web.app" 
        title="Z Speed Vendor Portal"
        allow="geolocation; microphone; camera; clipboard-write; clipboard-read;"
        onload="hideLoader()"
    ></iframe>

    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.visibility = 'hidden';
            }, 400);
        }
    </script>
</body>
</html>
